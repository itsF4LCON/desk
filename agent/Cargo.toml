[package]
name = "desk-agent"
version = "0.1.0"
edition = "2024"
description = "Low-latency browser remote desktop for Linux (Wayland/Hyprland) over WebRTC"
license = "MIT"
repository = "https://github.com/itsF4LCON/desk"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6"
ashpd = { version = "0.13", default-features = false, features = ["screencast", "tokio"] }
axum = { version = "0.8", features = ["ws", "macros"] }
base64 = "0.23.1"
bytes = "1.12.1"
evdev = "0.13"
futures = "0.3.34"
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"
hex = "0.4.3"
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
qrcode = "0.14"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
str0m = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
subtle = "2.6.1"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
totp-rs = { version = "6", features = ["qr", "gen_secret", "otpauth"] }
tower-http = { version = "0.7", features = ["fs", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
