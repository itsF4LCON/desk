<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>desk</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="app.js"></script>
</head>
<body class="min-h-screen flex flex-col font-sans selection:bg-black selection:text-white">

    <!-- Login -->
    <div id="login-view" class="min-h-screen flex flex-col hidden-view">
        <header class="border-b border-border bg-black dark-surface">
            <div class="max-w-5xl mx-auto px-6 h-16 flex items-center justify-between">
                <span class="font-mono text-xs font-medium tracking-wider text-heading flex items-center gap-2">
                    desk <span class="text-muted">/</span> <span data-host></span>
                </span>
                <div class="flex items-center space-x-2 text-[10px] font-mono tracking-widest text-muted">
                    <span class="w-1.5 h-1.5 bg-muted rounded-full"></span>
                    <span>PRIVATE</span>
                </div>
            </div>
        </header>

        <main class="max-w-5xl mx-auto px-6 pt-24 pb-20 w-full flex-grow">
            <section class="space-y-8 max-w-md">
                <div class="inline-flex items-center gap-2 border border-border px-3 py-1 text-[10px] font-mono text-muted uppercase tracking-wider">
                    <i data-lucide="shield-check" class="w-3 h-3"></i> Remote Access
                </div>
                <div class="space-y-4">
                    <h1 class="text-4xl sm:text-5xl font-medium text-heading tracking-tight">desk</h1>
                    <p class="text-lg leading-relaxed text-body font-light">
                        Authenticate to view and control this machine.
                    </p>
                </div>

                <form id="login-form" class="border border-border bg-surface p-6 space-y-6" autocomplete="on">
                    <label class="block space-y-2">
                        <span class="text-[10px] font-mono text-muted uppercase tracking-wider">Password</span>
                        <input id="password" name="password" type="password" required autocomplete="current-password"
                               class="w-full border border-border bg-card px-3 py-2.5 font-mono text-sm text-heading outline-none focus:border-borderHover transition-colors">
                    </label>
                    <label class="block space-y-2">
                        <span class="text-[10px] font-mono text-muted uppercase tracking-wider">Authenticator code</span>
                        <input id="code" name="code" inputmode="numeric" pattern="[0-9 ]{6,7}" maxlength="7" required
                               autocomplete="one-time-code" placeholder="000 000"
                               class="w-full border border-border bg-card px-3 py-2.5 font-mono text-sm tracking-[0.3em] text-heading outline-none focus:border-borderHover transition-colors">
                    </label>
                    <div class="flex items-center justify-between gap-4 pt-2 border-t border-border">
                        <p id="login-error" class="text-xs font-mono text-body min-h-4" role="alert"></p>
                        <button id="login-button" type="submit"
                                class="inline-flex items-center space-x-2 bg-heading text-white hover:bg-body px-5 py-2.5 text-xs font-mono font-medium transition-colors disabled:opacity-50">
                            <span>Connect</span>
                            <i data-lucide="arrow-right" class="w-3 h-3"></i>
                        </button>
                    </div>
                </form>

                <p class="text-[10px] font-mono text-muted uppercase tracking-wider flex items-center gap-2">
                    <i data-lucide="lock" class="w-3 h-3"></i> Cloudflare Access · Password · TOTP
                </p>
            </section>
        </main>

        <footer class="border-t border-border bg-surface py-8">
            <div class="max-w-5xl mx-auto px-6 text-[10px] font-mono text-muted uppercase tracking-wider">
                Private system · all sessions are announced on the host
            </div>
        </footer>
    </div>

    <!-- Viewer -->
    <div id="viewer-view" class="h-screen flex flex-col bg-black dark-surface hidden-view">
        <header class="border-b border-border bg-black dark-surface shrink-0">
            <div class="px-4 h-10 flex items-center justify-between gap-4">
                <div class="flex items-center gap-4 min-w-0">
                    <span class="font-mono text-xs font-medium tracking-wider text-heading whitespace-nowrap">
                        desk <span class="text-muted">/</span> <span data-host></span>
                    </span>
                    <div id="monitors" class="flex items-center"></div>
                </div>
                <div class="flex items-center gap-4">
                    <span id="stats" class="hidden md:inline text-[10px] font-mono text-muted uppercase tracking-wider whitespace-nowrap"></span>
                    <span id="status" class="flex items-center gap-2 text-[10px] font-mono text-muted uppercase tracking-widest">
                        <span id="status-dot" class="w-1.5 h-1.5 bg-muted rounded-full"></span>
                        <span id="status-text">Connecting</span>
                    </span>
                    <div class="flex items-center">
                        <button id="btn-clip-send" title="Send this device's clipboard to the PC"
                                class="p-2 text-muted hover:text-heading transition-colors"><i data-lucide="clipboard-paste" class="w-4 h-4"></i></button>
                        <button id="btn-clip-get" title="Copy the PC's clipboard to this device"
                                class="p-2 text-muted hover:text-heading transition-colors"><i data-lucide="clipboard-copy" class="w-4 h-4"></i></button>
                        <button id="btn-audio" title="Toggle audio"
                                class="p-2 text-muted hover:text-heading transition-colors"><i data-lucide="volume-x" class="w-4 h-4"></i></button>
                        <button id="btn-fullscreen" title="Fullscreen (captures system keys)"
                                class="p-2 text-muted hover:text-heading transition-colors"><i data-lucide="maximize" class="w-4 h-4"></i></button>
                        <button id="btn-logout" title="Disconnect and log out"
                                class="p-2 text-muted hover:text-heading transition-colors"><i data-lucide="log-out" class="w-4 h-4"></i></button>
                    </div>
                </div>
            </div>
        </header>
        <div id="stage" class="relative flex-grow min-h-0 bg-black">
            <video id="screen" class="w-full h-full object-contain cursor-none" autoplay playsinline muted tabindex="0"></video>
            <div id="overlay" class="absolute inset-0 flex items-center justify-center pointer-events-none">
                <div class="border border-border bg-black dark-surface px-5 py-3 flex items-center gap-3">
                    <i data-lucide="loader" class="w-3 h-3 text-muted animate-spin"></i>
                    <span id="overlay-text" class="text-[10px] font-mono text-muted uppercase tracking-wider">Establishing session</span>
                </div>
            </div>
            <div id="toast" class="absolute bottom-4 left-1/2 -translate-x-1/2 border border-border bg-black dark-surface px-4 py-2 text-[10px] font-mono text-body uppercase tracking-wider hidden-view"></div>
        </div>
    </div>
</body>
</html>
